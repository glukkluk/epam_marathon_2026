name: Deploy

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "scripts/configure-syndicate.py"
      - ".github/workflows/deploy.yml"

  workflow_dispatch:
    inputs:
      deploy:
        description: "Run syndicate deploy instead of update"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

env:
  APP_DIR: backend/restaurant-backend-app
  AWS_REGION: ${{ vars.AWS_REGION || 'eu-north-1' }}
  DEPLOY_NAME: dev

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: deploy
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Read AWS account ID
        run: echo "AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)" >> "$GITHUB_ENV"

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.x"

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-syndicate-1.21.3-${{ runner.os }}

      - name: Install AWS Syndicate
        run: pip install aws-syndicate==1.21.3

      - name: Configure Syndicate for this account
        env:
          EMAIL_FROM: ${{ vars.EMAIL_FROM }}
        run: python scripts/configure-syndicate.py

      - name: Prepare artifacts bucket and restore remote state
        working-directory: ${{ env.APP_DIR }}
        env:
          SDCT_CONF: .syndicate-config-restaurant-backend-app
        run: |
          if ! aws s3api head-bucket --bucket "marathon2026-restaurant-artifacts-${AWS_ACCOUNT_ID}"; then
            syndicate create-deploy-target-bucket
          fi
          syndicate sync

      - name: Syndicate build
        working-directory: ${{ env.APP_DIR }}
        env:
          SDCT_CONF: .syndicate-config-restaurant-backend-app
        run: syndicate build

      - name: Syndicate deploy
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy }}
        working-directory: ${{ env.APP_DIR }}
        env:
          SDCT_CONF: .syndicate-config-restaurant-backend-app
        run: syndicate deploy --deploy-name "$DEPLOY_NAME"

      - name: Syndicate update
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.deploy) }}
        working-directory: ${{ env.APP_DIR }}
        env:
          SDCT_CONF: .syndicate-config-restaurant-backend-app
        run: syndicate update --deploy-name "$DEPLOY_NAME"

      - name: Show backend URL
        run: |
          API_ID=$(aws apigateway get-rest-apis --query "items[?name=='restaurant-backend-api'].id | [0]" --output text)
          test "$API_ID" != "None"
          echo "BACKEND_URL=https://${API_ID}.execute-api.${AWS_REGION}.amazonaws.com/develop" >> "$GITHUB_STEP_SUMMARY"
