name: Frontend

on:
  pull_request:
    branches: [main]
    paths:
      - "frontend/restaurant-frontend-app/**"
      - ".github/workflows/pr.yml"
  push:
    branches: [main]
    paths:
      - "frontend/restaurant-frontend-app/**"
      - ".github/workflows/pr.yml"
  workflow_dispatch:

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'eu-north-1' }}

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend/restaurant-frontend-app
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: frontend/restaurant-frontend-app/.nvmrc
          cache: npm
          cache-dependency-path: frontend/restaurant-frontend-app/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check app
        run: npx tsc -p tsconfig.app.json --noEmit

      - name: Type-check specs
        run: npx tsc -p tsconfig.spec.json --noEmit

      - name: Production build
        run: npm run build
        env:
          BACKEND_URL: ${{ github.event_name == 'pull_request' && 'https://example.invalid/develop' || vars.BACKEND_URL }}

      - name: Configure AWS credentials
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to S3
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          S3_BUCKET: ${{ vars.S3_BUCKET }}
          CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          : "${S3_BUCKET:?Set the S3_BUCKET repository variable}"
          : "${CLOUDFRONT_DISTRIBUTION_ID:?Set the CLOUDFRONT_DISTRIBUTION_ID repository variable}"
          aws s3 sync dist/restaurant-frontend-app/browser "s3://${S3_BUCKET}/" --delete

      - name: Invalidate CloudFront
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
        run: aws cloudfront create-invalidation --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" --paths "/*"
