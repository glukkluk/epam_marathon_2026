name: Terraform

on:
  pull_request:
    branches:
      - main
    paths:
      - "infra/terraform/**"
      - ".github/workflows/terraform.yml"
  push:
    branches:
      - main
    paths:
      - "infra/terraform/**"
      - ".github/workflows/terraform.yml"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

env:
  TF_DIR: infra/terraform
  AWS_REGION: ${{ vars.AWS_REGION || 'eu-north-1' }}
  TF_VERSION: "1.10.5"
  TF_VAR_alert_emails: ${{ vars.ALERT_EMAILS || '[]' }}
  TF_VAR_aws_region: ${{ vars.AWS_REGION || 'eu-north-1' }}
  TF_IN_AUTOMATION: 'true'

jobs:
  plan:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: terraform-plan-${{ github.event.pull_request.number }}
      cancel-in-progress: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Read AWS account ID
        run: echo "TF_VAR_account_id=$(aws sts get-caller-identity --query Account --output text)" >> "$GITHUB_ENV"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform fmt check
        working-directory: ${{ env.TF_DIR }}
        run: terraform fmt -check -recursive

      - name: Terraform init
        working-directory: ${{ env.TF_DIR }}
        env:
          STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
        run: terraform init -input=false -backend-config="bucket=${STATE_BUCKET:-restaurant-terraform-state-${TF_VAR_account_id}}" -backend-config="region=$AWS_REGION"

      - name: Terraform validate
        working-directory: ${{ env.TF_DIR }}
        run: terraform validate

      - name: Terraform plan
        id: plan
        working-directory: ${{ env.TF_DIR }}
        run: |
          set -o pipefail
          terraform plan -input=false -no-color -out=tfplan 2>&1 | tee plan_output.txt
        continue-on-error: true

      - name: Prepare comment body
        working-directory: ${{ env.TF_DIR }}
        run: |
          grep -v 'Refreshing state\.\.\.' plan_output.txt > plan_filtered.txt || true
          summary=$(grep -E '^(No changes\.|Plan: )' plan_filtered.txt | head -1 || true)
          {
            echo "PLAN_BODY<<TF_PLAN_EOF"
            echo "### Terraform plan for \`infra/terraform\`"
            echo ""
            echo "${summary:-See details below.}"
            echo ""
            echo "<details><summary>Show full plan</summary>"
            echo ""
            echo '```'
            tail -c 60000 plan_filtered.txt
            echo '```'
            echo "</details>"
            echo "TF_PLAN_EOF"
          } >> "$GITHUB_ENV"

      - name: Comment plan on PR
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- terraform-plan-comment -->';
            const body = `${marker}\n${process.env.PLAN_BODY}`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Fail if plan failed
        if: steps.plan.outcome == 'failure'
        run: exit 1

  apply:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: terraform-apply
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Read AWS account ID
        run: echo "TF_VAR_account_id=$(aws sts get-caller-identity --query Account --output text)" >> "$GITHUB_ENV"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform init
        working-directory: ${{ env.TF_DIR }}
        env:
          STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
        run: terraform init -input=false -backend-config="bucket=${STATE_BUCKET:-restaurant-terraform-state-${TF_VAR_account_id}}" -backend-config="region=$AWS_REGION"

      - name: Terraform fmt check
        working-directory: ${{ env.TF_DIR }}
        run: terraform fmt -check -recursive

      - name: Terraform validate
        working-directory: ${{ env.TF_DIR }}
        run: terraform validate

      - name: Terraform apply
        working-directory: ${{ env.TF_DIR }}
        run: terraform apply -input=false -auto-approve

      - name: Show deployment outputs
        working-directory: ${{ env.TF_DIR }}
        run: terraform output -no-color >> "$GITHUB_STEP_SUMMARY"
